name: windows-msys2

on:
  push:
    branches:
  pull_request:
  workflow_dispatch:
    inputs:
      compare_startup:
        description: Build both revisions and publish a portable comparison package
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

concurrency:
  group: utsure-windows-${{ github.workflow }}-${{ github.ref }}-${{ (inputs.compare_startup || contains(github.event.head_commit.message, '[startup-comparison]')) && github.sha || 'regular' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      UTSURE_CMAKE_BUILD_TYPE: RelWithDebInfo
      UTSURE_MSYS2_PREFIX: "/ucrt64"
      UTSURE_TOOLCHAIN_ID_PREFIX: "ucrt64-gcc"
      UTSURE_FFMPEG_SOURCE: "mangetsu"
      UTSURE_FFMPEG_SERIES: "9.0"
      UTSURE_FFMPEG_VERSION: "9.0"
      UTSURE_FFMPEG_MANGETSU_REPO_URL: "https://github.com/amanosatosi/FFmpeg.git"
      UTSURE_FFMPEG_MANGETSU_REF: "9.0"
      UTSURE_FFMPEG_MANGETSU_COMMIT: "4e70a291327ae7c0c93713a29e09ce14259c6e27"
      UTSURE_FFMS2_REF: "25cef14386fcaaa58ee547065deee8f6e82c56a2"
      UTSURE_FFMPEG_CONFIGURE_FLAGS: >-
        --enable-gpl --enable-libx264 --enable-libx265 --enable-shared --disable-static
        --disable-debug --disable-doc --disable-ffplay --disable-programs --enable-ffmpeg --enable-ffprobe
        --enable-libass
      UTSURE_FONTCOLLECTOR_VERSION: "4.0.2"
      UTSURE_PYINSTALLER_VERSION: "6.19.0"
      UTSURE_LIBASSMOD_REF: "codex/windows-mangetsu-dll"
      UTSURE_LIBASSMOD_COMMIT: "0f60f21889f675757e808a2f571eb6e481d7e22f"
      UTSURE_WINDOWS_MANGETSU_DLL: "1"
      UTSURE_LIBASSMOD_ALIGNED_ALLOCATION_DEBUG: "1"
      UTSURE_PORTABLE_BUNDLE_NAME: encoder-windows-x64-portable
      UTSURE_STARTUP_BASELINE: c54141802f67844de0e7ded3682fbf7adb8585fa

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python for FontCollector
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Build FontCollector portable tool
        shell: pwsh
        run: ./scripts/ci/windows-build-fontcollector.ps1

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            autoconf
            automake
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libx264
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-x265
            mingw-w64-ucrt-x86_64-zlib
            curl
            libtool
            make

      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/ffmpeg
          key: utsure-${{ runner.os }}-${{ env.UTSURE_TOOLCHAIN_ID_PREFIX }}-ffmpeg-${{ env.UTSURE_FFMPEG_SOURCE }}-${{ env.UTSURE_FFMPEG_MANGETSU_COMMIT }}-${{ hashFiles('.github/workflows/windows-msys2.yml', 'scripts/ci/windows-msys2-build-ffmpeg.sh') }}
          restore-keys: |
            utsure-${{ runner.os }}-${{ env.UTSURE_TOOLCHAIN_ID_PREFIX }}-ffmpeg-${{ env.UTSURE_FFMPEG_SOURCE }}-${{ env.UTSURE_FFMPEG_MANGETSU_COMMIT }}-

      - name: Build libassmod
        run: ./scripts/ci/windows-msys2-build-libassmod.sh

      - name: Build FFmpeg
        run: ./scripts/ci/windows-msys2-build-ffmpeg.sh

      - name: Save FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/ffmpeg
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Build FFMS2
        run: ./scripts/ci/windows-msys2-build-ffms2.sh

      - name: Audit dependencies
        run: ./scripts/ci/windows-msys2-dependency-audit.sh

      - name: Configure, build, and smoke test
        run: ./scripts/ci/windows-msys2-build.sh

      - name: Package portable bundle
        run: ./scripts/ci/windows-msys2-package-portable.sh

      - name: Profile native portable startup
        id: profile-startup
        shell: pwsh
        run: |
          $portable = "artifacts/portable-validation/$env:UTSURE_PORTABLE_BUNDLE_NAME"
          $fixture = 'build/tests/app/media/runner-lifecycle-main.mp4'
          $batch = (New-Item -ItemType Directory -Force artifacts/benchmark-fixtures).FullName
          1..12 | ForEach-Object { Copy-Item -LiteralPath $fixture (Join-Path $batch "Episode-$_.mp4") }
          $settings = 'artifacts/benchmark-settings.json'
          '{"version":1,"lastUsed":{"preset":"fast","crf":20},"uiFont":{"family":"Pyidaungsu","pointSize":11},"toshiMode":{"enabled":true}}' | Set-Content $settings
          ./scripts/ci/windows-profile-startup.ps1 -PortableDirectory $portable -ReportDirectory artifacts/startup-profile/empty -VerifyDiagnostics
          ./scripts/ci/windows-profile-startup.ps1 -PortableDirectory $portable -ReportDirectory artifacts/startup-profile/single -OpenPath $fixture -SettingsFile $settings -Launches 6
          ./scripts/ci/windows-profile-startup.ps1 -PortableDirectory $portable -ReportDirectory artifacts/startup-profile/batch -OpenPath $batch -SettingsFile $settings -ExpectedJobs 12 -Launches 6

      - name: Build and package startup baseline with the same toolchain
        if: inputs.compare_startup || (github.event_name == 'push' && contains(github.event.head_commit.message, '[startup-comparison]'))
        id: build-startup-baseline
        run: |
          mkdir -p artifacts/baseline-source/scripts/ci
          git fetch --depth=1 origin "${UTSURE_STARTUP_BASELINE}"
          git archive "${UTSURE_STARTUP_BASELINE}" | tar -x -C artifacts/baseline-source
          cp scripts/ci/windows-msys2-build.sh artifacts/baseline-source/scripts/ci/
          export UTSURE_THIRD_PARTY_ROOT="$PWD/.deps"
          export UTSURE_ARTIFACT_ROOT="$PWD/artifacts/baseline-package"
          cd artifacts/baseline-source
          UTSURE_BUILD_APP_ONLY=ON ./scripts/ci/windows-msys2-build.sh
          ./scripts/ci/windows-msys2-package-portable.sh

      - name: Profile baseline on the same runner
        if: steps.build-startup-baseline.outcome == 'success'
        shell: pwsh
        run: |
          $portable = "artifacts/baseline-package/portable-validation/$env:UTSURE_PORTABLE_BUNDLE_NAME"
          $settings = 'artifacts/benchmark-settings.json'
          $fixture = 'build/tests/app/media/runner-lifecycle-main.mp4'
          ./scripts/ci/windows-profile-startup.ps1 -PortableDirectory $portable -ReportDirectory artifacts/startup-profile/baseline/empty -Commit $env:UTSURE_STARTUP_BASELINE
          ./scripts/ci/windows-profile-startup.ps1 -PortableDirectory $portable -ReportDirectory artifacts/startup-profile/baseline/single -Commit $env:UTSURE_STARTUP_BASELINE -OpenPath $fixture -SettingsFile $settings -Launches 6
          ./scripts/ci/windows-profile-startup.ps1 -PortableDirectory $portable -ReportDirectory artifacts/startup-profile/baseline/batch -Commit $env:UTSURE_STARTUP_BASELINE -OpenPath artifacts/benchmark-fixtures -SettingsFile $settings -ExpectedJobs 12 -Launches 6

      - name: Assemble portable benchmark package
        if: steps.build-startup-baseline.outcome == 'success'
        shell: pwsh
        run: |
          $package = (New-Item -ItemType Directory -Force artifacts/startup-benchmark).FullName
          $bundle = $env:UTSURE_PORTABLE_BUNDLE_NAME
          Copy-Item -Recurse "artifacts/baseline-package/portable-validation/$bundle" "$package/baseline"
          Copy-Item -Recurse "artifacts/portable-validation/$bundle" "$package/optimized"
          $env:UTSURE_STARTUP_BASELINE | Set-Content "$package/baseline/benchmark-commit.txt"
          $env:GITHUB_SHA | Set-Content "$package/optimized/benchmark-commit.txt"
          Copy-Item scripts/ci/Run-UtsureBenchmark.cmd,scripts/ci/Run-UtsureBenchmark.ps1,scripts/ci/windows-profile-startup.ps1,docs/dev/windows-startup.md,artifacts/benchmark-settings.json $package
          Copy-Item -Recurse artifacts/benchmark-fixtures "$package/fixtures"

      - name: Upload portable benchmark package
        if: steps.build-startup-baseline.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: utsure-windows-startup-benchmark
          path: artifacts/startup-benchmark/
          if-no-files-found: error

      - name: Upload startup profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-startup-profile
          path: |
            artifacts/startup-profile/**/*.csv
            artifacts/startup-profile/**/*.json
            artifacts/startup-profile/**/*.txt
            !artifacts/startup-profile/**/crash-dumps/**

      - name: Package debug symbols
        run: bash ./scripts/ci/windows-msys2-package-symbols.sh

      - name: Upload portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: encoder-windows-x64-portable
          if-no-files-found: error
          path: artifacts/encoder-windows-x64-portable.zip

      - name: Upload symbols artifact
        uses: actions/upload-artifact@v6
        with:
          name: utsure-windows-symbols-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/utsure-windows-symbols-*.zip

name: windows-msys2

on:
  push:
    branches:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  actions: read

concurrency:
  group: utsure-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      UTSURE_CMAKE_BUILD_TYPE: RelWithDebInfo
      UTSURE_MSYS2_PREFIX: "/ucrt64"
      UTSURE_TOOLCHAIN_ID_PREFIX: "ucrt64-gcc"
      UTSURE_FFMPEG_SOURCE: "mangetsu"
      UTSURE_FFMPEG_SERIES: "9.0"
      UTSURE_FFMPEG_VERSION: "9.0"
      UTSURE_FFMPEG_MANGETSU_REPO_URL: "https://github.com/amanosatosi/FFmpeg.git"
      UTSURE_FFMPEG_MANGETSU_REF: "9.0"
      UTSURE_FFMPEG_MANGETSU_COMMIT: "4a1a02cf9489319871135710d4a8f98baf461608"
      UTSURE_FFMS2_REF: "25cef14386fcaaa58ee547065deee8f6e82c56a2"
      UTSURE_FFMPEG_CONFIGURE_FLAGS: >-
        --enable-gpl --enable-libx264 --enable-libx265 --enable-shared --disable-static
        --disable-debug --disable-doc --disable-ffplay --disable-programs --enable-ffmpeg --enable-ffprobe
        --enable-libass
      UTSURE_FONTCOLLECTOR_VERSION: "4.0.2"
      UTSURE_PYINSTALLER_VERSION: "6.19.0"
      UTSURE_LIBASSMOD_REF: "mangetsu"
      UTSURE_LIBASSMOD_ALIGNED_ALLOCATION_DEBUG: "1"
      UTSURE_PORTABLE_BUNDLE_NAME: encoder-windows-x64-portable
      UTSURE_CTEST_ARGS: "-LE slow"

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python for FontCollector
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Build FontCollector portable tool
        shell: pwsh
        run: ./scripts/ci/windows-build-fontcollector.ps1

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            autoconf
            automake
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libx264
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-multimedia
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-x265
            mingw-w64-ucrt-x86_64-zlib
            curl
            libtool
            make

      - name: Validate shell script syntax
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "bash -n ${script}"
            bash -n "${script}"
          done < <(find scripts/ci -type f -name '*.sh' -print0)

      - name: Build latest Mangetsu
        id: mangetsu-build
        run: |
          ./scripts/ci/windows-msys2-build-libassmod.sh
          mangetsu_commit="$(cat "${UTSURE_THIRD_PARTY_ROOT:-.deps}/libassmod/resolved-commit.txt")"
          if [[ ! "${mangetsu_commit}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Mangetsu build did not produce a valid source revision" >&2
            exit 1
          fi
          echo "commit=${mangetsu_commit}" >> "${GITHUB_OUTPUT}"
          echo "Mangetsu built from ${UTSURE_LIBASSMOD_REF}: ${mangetsu_commit}"

      # Cache FFmpeg only against the exact Mangetsu revision used in this build.
      - name: Restore FFmpeg cache
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: .deps/ffmpeg
          key: utsure-${{ runner.os }}-${{ env.UTSURE_TOOLCHAIN_ID_PREFIX }}-ffmpeg-${{ env.UTSURE_FFMPEG_SOURCE }}-${{ env.UTSURE_FFMPEG_MANGETSU_COMMIT }}-mangetsu-${{ steps.mangetsu-build.outputs.commit }}-${{ hashFiles('.github/workflows/windows-msys2.yml', 'scripts/ci/windows-msys2-build-ffmpeg.sh') }}

      - name: Build FFmpeg
        run: ./scripts/ci/windows-msys2-build-ffmpeg.sh

      - name: Save FFmpeg cache
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .deps/ffmpeg
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}

      - name: Verify Mangetsu style rendering in FFmpeg
        run: bash ./scripts/ci/windows-msys2-test-mangetsu-styles.sh

      - name: Build FFMS2
        run: ./scripts/ci/windows-msys2-build-ffms2.sh

      - name: Audit dependencies
        run: ./scripts/ci/windows-msys2-dependency-audit.sh

      - name: Configure, build, and smoke test
        run: ./scripts/ci/windows-msys2-build.sh

      - name: Package portable bundle
        run: ./scripts/ci/windows-msys2-package-portable.sh

      - name: Download measured startup baseline
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[startup-baseline]')
        id: startup-baseline
        uses: actions/download-artifact@v8
        with:
          name: encoder-windows-x64-portable
          path: artifacts/startup-baseline
          github-token: ${{ github.token }}
          run-id: 43612049502

      - name: Profile baseline on the same runner
        if: steps.startup-baseline.outcome == 'success'
        shell: pwsh
        run: |
          $bundle = $env:UTSURE_PORTABLE_BUNDLE_NAME
          Expand-Archive "artifacts/startup-baseline/$bundle.zip" -DestinationPath artifacts/startup-baseline
          ./scripts/ci/windows-profile-startup.ps1 -PortableDirectory "artifacts/startup-baseline/$bundle" -ReportDirectory artifacts/startup-profile/baseline -Commit a24d0695b13b63f9228db235cf14a67141ce4a0b

      - name: Profile native portable startup
        shell: pwsh
        run: ./scripts/ci/windows-profile-startup.ps1 -PortableDirectory "artifacts/portable-validation/$env:UTSURE_PORTABLE_BUNDLE_NAME" -ReportDirectory artifacts/startup-profile/optimized -VerifyDiagnostics

      - name: Upload startup profile
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-startup-profile
          path: |
            artifacts/startup-profile/**/*.csv
            artifacts/startup-profile/**/*.json
            artifacts/startup-profile/**/*.txt
            !artifacts/startup-profile/**/crash-dumps/**

      - name: Package debug symbols
        run: bash ./scripts/ci/windows-msys2-package-symbols.sh

      - name: Upload portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: encoder-windows-x64-portable
          if-no-files-found: error
          path: artifacts/encoder-windows-x64-portable.zip

      - name: Upload symbols artifact
        uses: actions/upload-artifact@v6
        with:
          name: utsure-windows-symbols-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/utsure-windows-symbols-*.zip

name: benchmark-windows

on:
  workflow_dispatch:
    inputs:
      codec:
        description: Select which encoder benchmark(s) to run.
        type: choice
        options:
          - both
          - x264
          - x265
        default: both
      preset:
        description: Encoder preset to benchmark.
        required: true
        default: medium
        type: string
      crf_x264:
        description: CRF value to use for the x264 benchmark.
        required: true
        default: "23"
        type: string
      crf_x265:
        description: CRF value to use for the x265 benchmark.
        required: true
        default: "28"
        type: string
      sample_url:
        description: Optional URL for a custom benchmark sample. Leave blank to use the deterministic repo sample.
        required: false
        default: ""
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  benchmark:
    runs-on: windows-latest
    env:
      UTSURE_BUILD_APP: "OFF"
      UTSURE_RUN_APP_SMOKE_TEST: "OFF"
      UTSURE_BUILD_DIR: build-benchmark
      UTSURE_CMAKE_BUILD_TYPE: Release
      UTSURE_CTEST_REGEX: "utsure\\.core\\.job\\.encode\\.threading_modes"
      UTSURE_MSYS2_PREFIX: "/ucrt64"
      UTSURE_TOOLCHAIN_ID_PREFIX: "ucrt64-gcc"
      UTSURE_FFMPEG_SERIES: "7.1"
      UTSURE_FFMPEG_VERSION: "7.1.2"
      UTSURE_FFMS2_REF: "25cef14386fcaaa58ee547065deee8f6e82c56a2"
      UTSURE_FFMPEG_CONFIGURE_FLAGS: >-
        --enable-gpl --enable-libx264 --enable-libx265 --enable-shared --disable-static
        --disable-debug --disable-doc --disable-ffplay --disable-programs --enable-ffmpeg --enable-ffprobe
      UTSURE_LIBASSMOD_REF: "88a338192faf50505eb4cedfe7d1320265f1081f"

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            autoconf
            automake
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libx264
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-x265
            mingw-w64-ucrt-x86_64-zlib
            curl
            libtool
            make

      - name: Prepare benchmark artifact root
        run: |
          mkdir -p artifacts/benchmark
          echo "Benchmark artifacts directory: $(pwd)/artifacts/benchmark"

      # TODO(2026-05-01): Re-add the FFmpeg actions/cache restore/save steps around this build
      # once the temporary cache disablement is no longer needed.
      - name: Build FFmpeg
        run: ./scripts/ci/windows-msys2-build-ffmpeg.sh

      - name: Build libassmod
        run: ./scripts/ci/windows-msys2-build-libassmod.sh

      - name: Build FFMS2
        run: ./scripts/ci/windows-msys2-build-ffms2.sh

      - name: Audit dependencies
        run: ./scripts/ci/windows-msys2-dependency-audit.sh

      - name: Configure and build benchmark targets
        run: ./scripts/ci/windows-msys2-build.sh

      - name: Resolve benchmark sample
        id: sample
        run: |
          artifact_root="$(pwd)/artifacts/benchmark"
          input_path="$(pwd)/${UTSURE_BUILD_DIR}/tests/core/media/subtitle-stress-main.mp4"
          subtitle_path="$(pwd)/${UTSURE_BUILD_DIR}/tests/core/media/subtitle-burn-stress-sample.ass"

          if [[ -n "${{ inputs.sample_url }}" ]]; then
            mkdir -p "${artifact_root}/input"
            input_path="${artifact_root}/input/custom-sample.mp4"
            subtitle_path=""
            curl -L --fail --output "${input_path}" "${{ inputs.sample_url }}"
          fi

          echo "input_path=${input_path}" >> "${GITHUB_OUTPUT}"
          echo "subtitle_path=${subtitle_path}" >> "${GITHUB_OUTPUT}"
          echo "Benchmark sample input: ${input_path}"
          if [[ -n "${subtitle_path}" ]]; then
            echo "Benchmark subtitle input: ${subtitle_path}"
          else
            echo "Benchmark subtitle input: none"
          fi

      - name: Run benchmark
        run: |
          artifact_root="$(pwd)/artifacts/benchmark"
          benchmark_executable="./${UTSURE_BUILD_DIR}/tests/core/utsure_core_encode_benchmark.exe"
          mkdir -p "${artifact_root}/outputs"

          subtitle_args=()
          if [[ -n "${{ steps.sample.outputs.subtitle_path }}" ]]; then
            subtitle_args=(--subtitle "${{ steps.sample.outputs.subtitle_path }}")
          fi

          run_codec() {
            local codec="$1"
            local crf="$2"

            "${benchmark_executable}" \
              --input "${{ steps.sample.outputs.input_path }}" \
              "${subtitle_args[@]}" \
              --codec "${codec}" \
              --preset "${{ inputs.preset }}" \
              --crf "${crf}" \
              --output "${artifact_root}/outputs/benchmark-${codec}.mp4" \
              --benchmark-output-dir "${artifact_root}"
          }

          run_status=0
          case "${{ inputs.codec }}" in
            x264)
              run_codec x264 "${{ inputs.crf_x264 }}" || run_status=$?
              ;;
            x265)
              run_codec x265 "${{ inputs.crf_x265 }}" || run_status=$?
              ;;
            both)
              run_codec x264 "${{ inputs.crf_x264 }}" || run_status=$?
              run_codec x265 "${{ inputs.crf_x265 }}" || run_status=$?
              ;;
            *)
              echo "Unsupported codec selection: ${{ inputs.codec }}"
              exit 1
              ;;
          esac

          echo "Benchmark artifacts directory: ${artifact_root}"
          exit "${run_status}"

      - name: List benchmark artifacts
        if: always()
        run: |
          artifact_root="$(pwd)/artifacts/benchmark"
          echo "Benchmark artifacts directory: ${artifact_root}"
          if [[ -d "${artifact_root}" ]]; then
            find "${artifact_root}" -maxdepth 4 -type f | sort
          fi

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-logs-${{ github.run_id }}
          if-no-files-found: warn
          path: artifacts/benchmark/
